# This is a Declarative Automation Bundle definition for lakebase_101.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: lakebase_101

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  warehouse_id:
    description: SQL Warehouse ID for lakehouse queries
    default: 07111884d60ceee2
  catalog:
    description: The catalog to use
    default: lakebase_101_catalog
  schema:
    description: The schema to use
    default: lakebase_101_schema
  database_name:
    description: Postgres database name
    default: lakebase_101_db
  project_id:
    description: Lakebase project ID (lowercase, hyphen-delimited)
    default: lakebase-101-demo
  app_name:
    description: Databricks App name
    default: lakebase-101-app

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://data-ai-lakehouse.cloud.databricks.com
    variables:
      catalog: lakebase_101_catalog
      schema: lakebase_101_schema
  prod:
    mode: production
    workspace:
      host: https://data-ai-lakehouse.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/thibaut.gourdel@databricks.com to make sure we only have a single copy.
      root_path: /Workspace/Users/thibaut.gourdel@databricks.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: lakebase_101_catalog
      schema: prod
    permissions:
      - user_name: thibaut.gourdel@databricks.com
        level: CAN_MANAGE
