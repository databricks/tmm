command:
  - "python"
  - "-m"
  - "uvicorn"
  - "app:app"
  - "--host"
  - "0.0.0.0"
  - "--port"
  - "8000"

env:
  # Lakehouse gold (reverse-ETL source) + native synced table (Postgres schema) + managed pipeline
  - name: WAREHOUSE_ID
    valueFrom: sql-warehouse
  - name: PGDATABASE
    value: "lakebase_101_db"
  - name: LAKEBASE_ENDPOINT
    value: "projects/lakebase-101-demo/branches/production/endpoints/primary"
  - name: GOLD_TABLE
    value: "lakebase_101_catalog.lakebase_101_schema.customer_360_gold"
  - name: SYNCED_TABLE
    value: "lakebase_101_schema.customer_360_synced"
  - name: DIRECTORY_TABLE
    value: "lakebase_101_schema.customers_directory_synced"
  - name: DIRECTORY_SOURCE
    value: "lakebase_101_catalog.lakebase_101_schema.customers_directory"
  - name: SALES_TABLE
    value: "lakebase_101_schema.sales_events_synced"
  - name: SALES_SOURCE
    value: "lakebase_101_catalog.lakebase_101_schema.sales_events"