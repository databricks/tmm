site_name: OpenSky Avionics on Databricks
site_description: >-
  A hands-on tutorial — Databricks Marketplace, Genie Agents, Spark Declarative
  Pipelines, and Databricks Apps on the OpenSky full-day avionics dataset.

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.top
    - navigation.footer   # Prev/Next buttons in the footer
    - content.code.copy   # copy button on every code block

plugins:
  - search
  - callouts   # convert GitHub-style > [!NOTE] alerts into Material admonitions

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.highlight
  - pymdownx.superfences

# Page order lives here — reorder the tutorial by moving these lines.
nav:
  - 1. Databricks Marketplace: 01-marketplace.md
  - 2. Genie Agents — find data anomalies: 02-genie-eda.md
  - 3. Genie Agents — explore & visualize: 03-genie-explore.md
  - 4. Spark Declarative Pipeline (Genie Code): 04-pipeline.md
  - 5. Databricks App (Genie Code): 05-app.md
  - 6. OpenSharing — receive locally: 06-opensharing.md
  - 7. Wrap-up: 07-wrap-up.md
